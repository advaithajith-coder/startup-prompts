<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Startup Intelligence — Prompt Library</title>
<meta name="description" content="52 sections and 69 AI prompts that take a startup idea from problem framing to a go / no-go verdict, adapted to whichever country the founder is targeting.">
<style>
  :root {
    --bg: #0F0F10;
    --surface: #18181B;
    --surface2: #1E1E22;
    --surface3: #26262C;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #E8E8EC;
    --text2: #9A9AAF;
    --text3: #5A5A72;
    --accent: #7C6FE0;
    --accent2: #A898FF;
    --green: #22C55E;
    --amber: #F59E0B;
    --coral: #EF4444;
    --teal: #14B8A6;
    --pink: #EC4899;
    --radius: 10px;
    --sidebar-w: 270px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  /* ── LAYOUT ────────────────────────────────── */
  .app { display: flex; height: 100vh; overflow: hidden; }
  .sidebar { width: var(--sidebar-w); min-width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .content { flex: 1; overflow-y: auto; padding: 28px 32px; }

  /* ── SIDEBAR ───────────────────────────────── */
  .sidebar-header { padding: 18px 16px 14px; border-bottom: 1px solid var(--border); }
  .sidebar-logo { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  .sidebar-logo span { background: linear-gradient(135deg, var(--accent2), #C084FC); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .sidebar-stats { display: flex; gap: 6px; margin-top: 10px; }
  .s-stat { font-size: 10px; padding: 2px 7px; border-radius: 20px; background: var(--surface3); color: var(--text2); }
  .s-stat.new { background: rgba(124,111,224,0.2); color: var(--accent2); }

  .sidebar-search { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .sidebar-search input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 7px; padding: 7px 10px; color: var(--text); font-size: 12px; outline: none; }
  .sidebar-search input::placeholder { color: var(--text3); }
  .sidebar-search input:focus { border-color: var(--accent); }

  .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
  .sidebar-nav::-webkit-scrollbar { width: 3px; }
  .sidebar-nav::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }

  .pillar-group { margin-bottom: 2px; }
  .pillar-toggle { display: flex; align-items: center; gap: 8px; padding: 8px 14px; cursor: pointer; color: var(--text2); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; transition: color .15s; user-select: none; }
  .pillar-toggle:hover { color: var(--text); }
  .pillar-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .pillar-toggle .chv { margin-left: auto; font-size: 9px; transition: transform .2s; }
  .pillar-toggle.open .chv { transform: rotate(90deg); }

  .section-link { display: flex; align-items: center; gap: 8px; padding: 7px 14px 7px 30px; cursor: pointer; color: var(--text2); font-size: 12px; transition: all .15s; border-left: 2px solid transparent; }
  .section-link:hover { color: var(--text); background: var(--surface2); }
  .section-link.active { color: var(--text); background: var(--surface2); }
  .section-link .s-code { font-size: 10px; font-weight: 600; opacity: .6; min-width: 24px; }
  .section-link .s-name { flex: 1; line-height: 1.3; }
  .section-link .s-new { width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); flex-shrink: 0; }

  /* ── HEADER ────────────────────────────────── */
  .top-header { padding: 16px 32px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; background: var(--surface); flex-shrink: 0; }
  .header-title { font-size: 15px; font-weight: 600; flex: 1; }
  .header-title small { font-size: 11px; font-weight: 400; color: var(--text2); margin-left: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; transition: all .15s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #6357CC; }
  .btn-ghost { background: var(--surface2); color: var(--text2); border: 1px solid var(--border2); }
  .btn-ghost:hover { color: var(--text); background: var(--surface3); }

  /* ── SECTION DETAIL ────────────────────────── */
  .section-hero { margin-bottom: 28px; }
  .section-hero-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .section-code-badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 7px; letter-spacing: .04em; }
  .section-big-title { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -.02em; }
  .section-desc { font-size: 13px; color: var(--text2); line-height: 1.7; max-width: 680px; margin-top: 8px; }
  .section-meta { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .meta-chip { display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 11px; border: 1px solid var(--border2); color: var(--text2); }
  .meta-chip svg { width: 11px; height: 11px; }
  .meta-chip.order { border-color: rgba(124,111,224,0.4); color: var(--accent2); }
  .meta-chip.dep { border-color: rgba(20,184,166,0.4); color: var(--teal); }
  .meta-chip.warn { border-color: rgba(245,158,11,0.4); color: var(--amber); }

  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 20px; letter-spacing: .04em; text-transform: uppercase; }
  .badge-new { background: rgba(124,111,224,0.2); color: var(--accent2); }
  .badge-unique { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge-local { background: rgba(245,158,11,0.15); color: var(--amber); }
  .badge-standard { background: var(--surface3); color: var(--text2); }
  .badge-prompt { background: rgba(20,184,166,0.15); color: var(--teal); }

  /* ── PROMPT CARDS ──────────────────────────── */
  .prompts-header { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
  .prompt-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
  .prompt-card-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; cursor: pointer; border-bottom: 1px solid transparent; transition: background .15s; }
  .prompt-card-head:hover { background: var(--surface2); }
  .prompt-card-head.open { border-bottom-color: var(--border); }
  .prompt-num { font-size: 10px; font-weight: 700; width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: var(--surface3); color: var(--text2); flex-shrink: 0; }
  .prompt-title { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; }
  .prompt-title small { font-weight: 400; color: var(--text3); margin-left: 6px; }
  .copy-btn { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 6px; font-size: 11px; background: var(--surface3); color: var(--text2); border: none; cursor: pointer; transition: all .15s; }
  .copy-btn:hover { background: var(--accent); color: #fff; }
  .copy-btn.copied { background: rgba(34,197,94,0.2); color: var(--green); }
  .prompt-body { padding: 16px; }
  .prompt-text { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 12px; line-height: 1.8; color: #C9C9E0; white-space: pre-wrap; word-break: break-word; }

  /* ── EMPTY STATE ───────────────────────────── */
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; color: var(--text3); }
  .empty-icon { font-size: 40px; opacity: .3; }
  .empty-title { font-size: 16px; font-weight: 500; color: var(--text2); }

  /* ── MODAL ─────────────────────────────────── */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 14px; width: 100%; max-width: 600px; max-height: 88vh; overflow-y: auto; }
  .modal-header { display: flex; align-items: center; padding: 20px 24px 16px; border-bottom: 1px solid var(--border); }
  .modal-title { font-size: 16px; font-weight: 600; flex: 1; }
  .modal-close { background: var(--surface3); border: none; color: var(--text2); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  .modal-body { padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-label { font-size: 12px; font-weight: 500; color: var(--text2); }
  .form-input, .form-select, .form-textarea { background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 13px; font-family: inherit; outline: none; transition: border .15s; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { min-height: 140px; resize: vertical; font-family: 'SF Mono', monospace; font-size: 12px; line-height: 1.7; }
  .form-select option { background: var(--surface2); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ── SCROLLBAR ─────────────────────────────── */
  .content::-webkit-scrollbar { width: 4px; }
  .content::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

  .divider { height: 1px; background: var(--border); margin: 24px 0; }

  .hidden { display: none !important; }

  /* Execution order timeline */
  .exec-timeline { display: flex; align-items: center; gap: 6px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 24px; overflow-x: auto; }
  .exec-step { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text3); white-space: nowrap; }
  .exec-step.current { color: var(--accent2); font-weight: 600; }
  .exec-arrow { color: var(--text3); font-size: 10px; }

  .menu-btn { display: none; }
  .sidebar-scrim { display: none; }

  /* ── PHONES & SMALL TABLETS ────────────────── */
  @media (max-width: 768px) {
    .sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; width: 84vw; max-width: 320px; min-width: 0; transform: translateX(-100%); transition: transform .2s ease; }
    .app.nav-open .sidebar { transform: translateX(0); }
    .app.nav-open .sidebar-scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 40; }
    .menu-btn { display: inline-flex; }
    .top-header { padding: 12px 14px; gap: 8px; flex-wrap: wrap; }
    .header-title { font-size: 14px; min-width: 0; }
    .header-title small { display: block; margin-left: 0; margin-top: 2px; }
    .btn { padding: 7px 10px; }
    .content { padding: 18px 14px; }
    .section-big-title { font-size: 18px; }
    .prompt-card-head { flex-wrap: wrap; }
    .prompt-text { padding: 12px; font-size: 11.5px; }
    .form-row { grid-template-columns: 1fr; }
    .modal-body { padding: 16px; }
  }

  .progressive-banner { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.25); border-radius: 8px; padding: 10px 14px; margin-bottom: 20px; display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: #FCD34D; line-height: 1.5; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="sidebar-scrim" onclick="setNav(false)"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">🚀 <span>Startup Intelligence</span></div>
      <div class="sidebar-stats">
        <span class="s-stat">52 sections</span>
        <span class="s-stat">8 pillars</span>
        <span class="s-stat new">+2 new</span>
      </div>
    </div>
    <div class="sidebar-search">
      <input type="text" id="searchInput" placeholder="Search sections…" oninput="filterSections(this.value)">
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="top-header">
      <button class="btn btn-ghost menu-btn" onclick="setNav(true)" aria-label="Open section list">☰</button>
      <div class="header-title" id="headerTitle">Select a section <small>to view its prompts</small></div>
      <button class="btn btn-ghost" onclick="exportAll()">⬇ Export All</button>
      <button class="btn btn-primary" onclick="openAddModal()">+ Add Section</button>
    </header>
    <div class="content" id="mainContent">
      <div class="empty">
        <div class="empty-icon">📋</div>
        <div class="empty-title">Select a section from the sidebar</div>
        <div style="font-size:12px;">52 sections · 8 pillars · 69 prompts</div>
      </div>
    </div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="modal-backdrop hidden" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Add New Section / Prompt<div style="font-size:11px;font-weight:400;color:var(--text2);margin-top:4px;">Saved in this browser only. Use “Export All” to keep a copy.</div></div>
      <button class="modal-close" onclick="closeAddModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Pillar</label>
          <select class="form-select" id="addPillar"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Section Code</label>
          <input class="form-input" id="addCode" placeholder="e.g. A9, B7, X1">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Section Title</label>
        <input class="form-input" id="addTitle" placeholder="e.g. Community Building Strategy">
      </div>
      <div class="form-group">
        <label class="form-label">Section Description</label>
        <input class="form-input" id="addDesc" placeholder="One-line description of what this section covers">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Badge Type</label>
          <select class="form-select" id="addBadge">
            <option value="standard">Standard</option>
            <option value="unique">Unique</option>
            <option value="local">Local market</option>
            <option value="new">New Addition</option>
            <option value="prompt">AI Prompt</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Execution Order</label>
          <input class="form-input" id="addOrder" type="number" placeholder="e.g. 15">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Dependencies (comma separated)</label>
        <input class="form-input" id="addDeps" placeholder="e.g. context.md, A3, B1">
      </div>
      <div class="form-group">
        <label class="form-label">Needs progressive.md?</label>
        <select class="form-select" id="addProgressive">
          <option value="false">No — only context.md</option>
          <option value="true">Yes — reads all prior research</option>
        </select>
      </div>
      <div class="divider" style="margin:4px 0"></div>
      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;">Prompt</div>
      <div class="form-group">
        <label class="form-label">Prompt Title</label>
        <input class="form-input" id="addPromptTitle" placeholder="e.g. Core Analysis">
      </div>
      <div class="form-group">
        <label class="form-label">Prompt Text</label>
        <textarea class="form-textarea" id="addPromptText" placeholder="Write the full prompt here. Use {{context.md}} and {{progressive.md}} as placeholders for file references."></textarea>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="saveNewSection()">Save Section</button>
    </div>
  </div>
</div>

<script>
// ── DATA ───────────────────────────────────────────────────────────────────

const PILLARS = [
  { id:"P0", code:"P0", name:"Idea Intake & Problem Framing", color:"#7C6FE0", short:"Phase 0" },
  { id:"PA", code:"A", name:"Market Intelligence", color:"#3B82F6", short:"Pillar A" },
  { id:"PB", code:"B", name:"Business Model & Financials", color:"#22C55E", short:"Pillar B" },
  { id:"PC", code:"C", name:"Execution & Growth", color:"#F59E0B", short:"Pillar C" },
  { id:"PD", code:"D", name:"Local Infrastructure", color:"#EF4444", short:"Pillar D" },
  { id:"PE", code:"E", name:"Strategic Defense", color:"#EC4899", short:"Pillar E" },
  { id:"PF", code:"F", name:"Founder Intelligence & Action", color:"#14B8A6", short:"Pillar F" },
  { id:"PG", code:"G", name:"Consulting-Grade Prompts", color:"#8B5CF6", short:"Pillar G" },
];

function ctx() { return `Read context.md carefully before responding. It contains the founder's name, startup idea, target customer, target market (country or region), local currency, budget, stage, and team. Wherever this prompt says "the target market", use the country or region named in context.md, and give all money amounts in its local currency.`; }
function prog() { return `Read context.md AND progressive.md. progressive.md contains all research outputs generated so far — use it to avoid repeating work and to connect findings across sections. Wherever this prompt says "the target market", use the country or region named in context.md, and give all money amounts in its local currency.`; }

const SECTIONS = [
// ── PHASE 0 ──────────────────────────────────────────────────────────────
{
  pillar:"P0", code:"P1", title:"Problem Statement Canvas", badge:"new",
  execOrder:1, deps:["context.md"], needsProgressive:false,
  desc:"Lock the problem definition before any market research begins. The foundation everything else is built on.",
  prompts:[
    { id:"P1.1", title:"Core Problem Articulation",
      text:`You are a seasoned startup advisor who has reviewed over 500 founder pitches. Your job is to force radical clarity on the problem being solved before any research is run.

${ctx()}

Task: Write a precise problem statement using this exact structure:
"[Customer segment] currently struggle with [specific pain] when [triggering situation], which results in [measurable negative outcome]. Today they solve this by [current workaround], which fails because [specific failure mode]."

Then answer each of the following:
1. Is this a VITAMIN (nice-to-have), PAINKILLER (urgent need), or SURGERY (unavoidable necessity)? Score it 1–10 on urgency.
2. Frequency of this pain: Daily / Weekly / Monthly / Rarely
3. What does the customer LOSE if this problem is NOT solved? (Time / Money / Opportunity / Relationships — quantify if possible)
4. Emotional intensity: Low / Medium / High — state why

Output Format:
---
PROBLEM STATEMENT: [one sentence, fill the template above]
PAIN TYPE: [Vitamin / Painkiller / Surgery]
URGENCY SCORE: [X/10] — reason in one line
FREQUENCY: [Daily/Weekly/Monthly]
COST OF INACTION: [quantified estimate]
EMOTIONAL INTENSITY: [Low/Medium/High] — one-line reason
---` },
    { id:"P1.2", title:"Current Workaround & Substitute Map",
      text:`You are a user researcher who specialises in substitute behaviour — understanding what people do RIGHT NOW when a good solution does not yet exist.

${ctx()}

For the startup idea described, map the complete substitute landscape:

1. List every method the target customer currently uses to handle this problem (minimum 5 workarounds).
2. For each workaround: cost (time + money), what it does well, what it fails at, who uses it.
3. Identify the GOOD ENOUGH TRAP: Is there a workaround that satisfies 70% of the need at low cost? If yes, this is the biggest adoption risk — call it out explicitly.
4. Identify the SWITCHING TRIGGER: What specific event or threshold makes someone abandon their current workaround and pay for a proper solution?

Output as a Markdown table followed by:
- Good enough trap: [Y/N] — explanation
- Switching trigger: [specific event description]
- Key insight for product design: [one paragraph]` },
    { id:"P1.3", title:"Founder-Problem Fit Memo",
      text:`You are a seed-stage investor doing a first-pass filter on founder-market fit. You are not assessing the market — only whether this specific founder is the right person to solve this problem.

${ctx()}

Assess the following five dimensions:

1. ORIGIN CLARITY (1–5): Does the founder have lived experience with this problem?
   5 = They personally suffered this pain and lost money/time because of it
   3 = They observed it closely in a professional context
   1 = They read about it or heard it secondhand

2. INSIGHT EDGE: What does this founder understand about this problem that someone who just Googled it would NOT know?

3. NETWORK ACCESS: Does the founder already personally know 10+ people who have this problem? If yes, describe the access.

4. CREDIBILITY SIGNAL: What would make a potential customer immediately trust this founder to solve this problem?

5. BLIND SPOT WARNING: What aspect of this problem is the founder most likely to misunderstand due to their background?

Final output: Founder-Problem Fit Score [X/20] with a 3-bullet memo.` }
  ]
},
{
  pillar:"P0", code:"P2", title:"Assumption Inventory", badge:"new",
  execOrder:2, deps:["context.md","P1 outputs"], needsProgressive:false,
  desc:"Extract and risk-rank every assumption baked into the idea before research runs.",
  prompts:[
    { id:"P2.1", title:"Full Assumption Extraction",
      text:`You are a critical thinking coach trained in hypothesis-driven consulting at McKinsey. Your job is to surface every hidden assumption in a startup idea so research is focused on what matters most.

${ctx()}

Extract EVERY assumption embedded in this startup idea across these 7 categories:
- CUSTOMER: Do these people exist? Do they have this problem? Will they pay?
- MARKET: Is the market big enough? Is it growing fast enough?
- TECHNICAL: Can this be built? At what cost? In what timeframe?
- CHANNEL: Can we reach these customers? At what CAC?
- BUSINESS MODEL: Will people pay this price? Will they renew/repeat?
- TIMING: Is the market ready now? Is it too early or too late?
- TEAM: Does the founding team have the skills to execute this?

For each assumption output:
| Assumption | Category | If wrong: consequence | Validation evidence needed | Test difficulty |
Where consequence = LOW / MEDIUM / FATAL
And test difficulty = EASY / MEDIUM / HARD

Sort by: FATAL assumptions first.
End with: "The 3 BET-THE-COMPANY assumptions are: [list with one line each on why they are existential]"` },
    { id:"P2.2", title:"Research Priority & Experiment Sequencer",
      text:`You are a lean startup coach. The founder has a list of assumptions. Your job is to sequence validation experiments so the most dangerous assumptions are tested first, cheapest and fastest.

${ctx()}
Additionally read the P2.1 Assumption Extraction output.

For each FATAL assumption from P2.1:
1. Design the cheapest, fastest possible experiment to test if it is true
2. Estimate: time to run, cost in local currency, minimum sample size
3. Define a GREEN signal (this assumption is likely true — keep going)
4. Define a RED signal (this assumption is false — major pivot required)
5. Define the KILL threshold: what result stops the entire project?

Output: Prioritised Experiment Backlog
| Priority | Assumption | Experiment design | Cost | Time | Green signal | Red signal | Kill? |

// ── RENDER ─────────────────────────────────────────────────────────────────

let activeSection = null;

function getPillar(id) { return PILLARS.find(p => p.id === id); }
function esc(v) { return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// Sections added with "+ Add Section" are saved in this browser only (localStorage).
const CUSTOM_KEY = 'startup-prompts.custom-sections';
function loadCustomSections() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_KEY)) || []; } catch (e) { return []; }
}
function saveCustomSections(list) {
  try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(list)); return true; } catch (e) { return false; }
}

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = '';
  PILLARS.forEach(p => {
    const secs = SECTIONS.filter(s => s.pillar === p.id);
    const g = document.createElement('div');
    g.className = 'pillar-group';
    g.innerHTML = `<div class="pillar-toggle" onclick="togglePillar(this)">
      <div class="pillar-dot" style="background:${p.color}"></div>
      ${p.short} — ${p.name.split(' ')[0]}
      <span class="chv">▶</span>
    </div>
    <div class="pillar-sections hidden" id="pillar-${p.id}">
      ${secs.map(s => `<div class="section-link ${s.needsProgressive ? 'prog' : ''}" data-code="${s.code}" onclick="selectSection('${s.code}')">
        <span class="s-code">${s.code}</span>
        <span class="s-name">${esc(s.title)}</span>
        ${s.badge === 'new' ? '<span class="s-new"></span>' : ''}
      </div>`).join('')}
    </div>`;
    nav.appendChild(g);
  });
}

function togglePillar(el) {
  el.classList.toggle('open');
  const content = el.nextElementSibling;
  content.classList.toggle('hidden');
}

function selectSection(code) {
  const sec = SECTIONS.find(s => s.code === code);
  if (!sec) return;
  activeSection = code;
  document.querySelectorAll('.section-link').forEach(l => {
    l.classList.toggle('active', l.dataset.code === code);
    const pillar = l.closest('.pillar-group');
    if (l.dataset.code === code && pillar) {
      const toggle = pillar.querySelector('.pillar-toggle');
      const content = pillar.querySelector('.pillar-sections');
      toggle.classList.add('open');
      content.classList.remove('hidden');
    }
  });
  renderSection(sec);
  setNav(false);
  document.getElementById('mainContent').scrollTop = 0;
}

function setNav(open) { document.getElementById('app').classList.toggle('nav-open', open); }

function badgeHtml(b) {
  const map = { new:['badge-new','+ NEW'], unique:['badge-unique','UNIQUE'], local:['badge-local','LOCAL'], standard:['badge-standard','STANDARD'], prompt:['badge-prompt','AI PROMPT'] };
  const [cls, label] = map[b] || map.standard;
  return `<span class="badge ${cls}">${label}</span>`;
}

function renderSection(sec) {
  const pillar = getPillar(sec.pillar);
  document.getElementById('headerTitle').innerHTML = `${esc(sec.code)}: ${esc(sec.title)} <small>${esc(pillar.name)}</small>`;

  let html = `<div class="section-hero">
    <div class="section-hero-top">
      <span class="section-code-badge" style="background:${pillar.color}22;color:${pillar.color};border:1px solid ${pillar.color}44">${sec.code}</span>
      ${badgeHtml(sec.badge)}
    </div>
    <div class="section-big-title">${esc(sec.title)}</div>
    <div class="section-desc">${esc(sec.desc)}</div>
    <div class="section-meta">
      <span class="meta-chip order">⚡ Execution order: ${sec.execOrder}</span>
      ${sec.deps.map(d => `<span class="meta-chip dep">📎 ${esc(d)}</span>`).join('')}
    </div>
  </div>`;

  if (sec.needsProgressive) {
    html += `<div class="progressive-banner">⚠️ <span><strong>Reads progressive.md</strong> — Run this section AFTER all dependency sections are complete and their outputs have been saved to progressive.md.</span></div>`;
  }

  html += `<div class="prompts-header"><span>${sec.prompts.length} prompt${sec.prompts.length > 1 ? 's' : ''} in this section</span><span style="color:var(--text3);font-weight:400">Click to expand</span></div>`;

  sec.prompts.forEach((p, i) => {
    html += `<div class="prompt-card" id="pc-${p.id}">
      <div class="prompt-card-head" onclick="togglePrompt('${p.id}')">
        <div class="prompt-num">${p.id}</div>
        <div class="prompt-title">${esc(p.title)}</div>
        <button class="copy-btn" onclick="copyPrompt(event,'${p.id}')">⎘ Copy</button>
      </div>
      <div class="prompt-body hidden" id="pb-${p.id}">
        <div class="prompt-text" id="pt-${p.id}">${esc(p.text)}</div>
      </div>
    </div>`;
  });

  document.getElementById('mainContent').innerHTML = html;
}

function togglePrompt(id) {
  const body = document.getElementById('pb-' + id);
  const head = body.previousElementSibling;
  const open = body.classList.toggle('hidden');
  head.classList.toggle('open', !open);
}

function copyPrompt(e, id) {
  e.stopPropagation();
  const el = document.getElementById('pt-' + id);
  const text = el ? el.innerText : '';
  navigator.clipboard.writeText(text).then(() => {
    const btn = e.target;
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '⎘ Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

function filterSections(q) {
  const lq = q.toLowerCase();
  document.querySelectorAll('.section-link').forEach(el => {
    const name = el.querySelector('.s-name').textContent.toLowerCase();
    const code = el.querySelector('.s-code').textContent.toLowerCase();
    el.style.display = (name.includes(lq) || code.includes(lq)) ? '' : 'none';
  });
}

function exportAll() {
  let out = `# STARTUP INTELLIGENCE REPORT — PROMPT LIBRARY\n# Generated from Blueprint (52 sections, 8 pillars)\n\n`;
  out += `## HOW TO USE\n- context.md: Created from initial founder intake form\n- progressive.md: Accumulates all research outputs section by section\n- Sections marked "needsProgressive: true" should run LAST\n- Run sections in execution order (lowest number first)\n\n---\n\n`;
  PILLARS.forEach(p => {
    const secs = SECTIONS.filter(s => s.pillar === p.id);
    if (!secs.length) return;
    out += `# ${p.short}: ${p.name}\n\n`;
    secs.sort((a,b) => a.execOrder - b.execOrder).forEach(s => {
      out += `## ${s.code} — ${s.title}\n`;
      out += `**Badge:** ${s.badge} | **Execution Order:** ${s.execOrder} | **Needs Progressive.md:** ${s.needsProgressive}\n`;
      out += `**Dependencies:** ${s.deps.join(', ')}\n`;
      out += `**Description:** ${s.desc}\n\n`;
      s.prompts.forEach(p => {
        out += `### ${p.id}: ${p.title}\n\`\`\`\n${p.text}\n\`\`\`\n\n`;
      });
      out += `---\n\n`;
    });
  });
  const blob = new Blob([out], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'startup-intelligence-prompts.md';
  a.click();
}

// ── MODAL ──────────────────────────────────────────────────────────────────

function openAddModal() {
  const sel = document.getElementById('addPillar');
  sel.innerHTML = PILLARS.map(p => `<option value="${p.id}">${p.short} — ${p.name}</option>`).join('');
  document.getElementById('addModal').classList.remove('hidden');
}

function closeAddModal() {
  document.getElementById('addModal').classList.add('hidden');
}

document.getElementById('addModal').addEventListener('click', function(e) {
  if (e.target === this) closeAddModal();
});

function saveNewSection() {
  const pillarId = document.getElementById('addPillar').value;
  const code = document.getElementById('addCode').value.trim();
  const title = document.getElementById('addTitle').value.trim();
  const desc = document.getElementById('addDesc').value.trim();
  const badge = document.getElementById('addBadge').value;
  const execOrder = parseInt(document.getElementById('addOrder').value) || 99;
  const deps = document.getElementById('addDeps').value.split(',').map(d => d.trim()).filter(Boolean);
  const needsProgressive = document.getElementById('addProgressive').value === 'true';
  const pTitle = document.getElementById('addPromptTitle').value.trim();
  const pText = document.getElementById('addPromptText').value.trim();

  if (!code || !title || !pTitle || !pText) {
    alert('Please fill in: Section Code, Title, Prompt Title, and Prompt Text.');
    return;
  }
  if (!/^[A-Za-z0-9]+$/.test(code)) {
    alert('Section Code can only contain letters and numbers (e.g. A9, X1).');
    return;
  }
  if (SECTIONS.some(s => s.code.toLowerCase() === code.toLowerCase())) {
    alert(`Section code "${code}" already exists. Pick a different code.`);
    return;
  }

  const newSection = {
    pillar: pillarId, code, title, badge, execOrder, deps,
    needsProgressive, desc: desc || 'Custom section.', custom: true,
    prompts: [{ id: `${code}.1`, title: pTitle, text: pText }]
  };
  SECTIONS.push(newSection);
  const custom = loadCustomSections();
  custom.push(newSection);
  if (!saveCustomSections(custom)) {
    alert('Section added, but this browser would not let it be saved. It will disappear when you reload the page. Use "Export All" to keep a copy.');
  }

  renderSidebar();
  closeAddModal();
  selectSection(code);

  // Clear form
  ['addCode','addTitle','addDesc','addOrder','addDeps','addPromptTitle','addPromptText'].forEach(id => { document.getElementById(id).value = ''; });
}

// ── INIT ───────────────────────────────────────────────────────────────────
loadCustomSections().forEach(s => {
  if (s && s.code && !SECTIONS.some(x => x.code === s.code)) SECTIONS.push(s);
});
renderSidebar();
// Open first pillar by default
document.querySelector('.pillar-toggle').click();
</script>
